# Pinned so this file and the root compose file resolve to the SAME project.
# Every service sets an explicit container_name, which is global rather than
# project-scoped, so two projects can never hold the same service at once.
name: devboard

services:
  devboard-analytics:
    build:
      context: .
    container_name: devboard-analytics
    restart: unless-stopped
    env_file: .env
    ports:
      - "8006:8000"
    networks:
      - devboard-network
      
  devboard-analytics-worker:
    build:
      context: .
    # No container_name here, unlike every other service: a fixed name blocks
    # `docker compose up --scale ...=N`. worker.py reads CONSUMER_NAME
    # (falling back to the container hostname, unique per replica) instead of
    # a hardcoded consumer name, so this is now safe to scale.
    restart: unless-stopped
    env_file: .env
    command: python -m app.consumer.worker
    networks:
      - devboard-network

networks:
  devboard-network:
    name: devboard-network
    external: true