services:
  devboard-analytics:
    build:
      context: .
    container_name: devboard-analytics
    restart: unless-stopped
    env_file: .env
    ports:
      - "8006:8000"
    networks:
      - devboard-network
      
  devboard-analytics-worker:
    build:
      context: .
    container_name: devboard-analytics-worker
    restart: unless-stopped
    env_file: .env
    command: python -m app.consumer.worker
    networks:
      - devboard-network

networks:
  devboard-network:
    name: devboard-network
    external: true
